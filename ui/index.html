<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundcore Liberty 5</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header"><div><p class="eyebrow">SOUNDCORE</p><h1>Liberty 5</h1></div><div class="header-actions"><div class="lang-switch" role="group" data-i18n-aria="lang.switchLabel"><button type="button" class="lang-btn" data-lang="tr" aria-pressed="true">TR</button><button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button></div><span id="connection" class="status" data-i18n="status.disconnected">Bağlı değil</span></div></header>
    <section class="card connection-card">
      <label for="device" data-i18n="device.label">Cihaz</label>
      <div class="row"><select id="device" aria-label="Liberty 5 cihazı" data-i18n-aria="device.selectAriaLabel"></select><button id="refresh" class="secondary" data-i18n="refresh">Yenile</button></div>
      <button id="connect" class="primary" disabled data-i18n="connect">Bağlan</button>
    </section>
    <section class="card">
      <div class="section-title"><h2 data-i18n="battery.title">Pil</h2><span id="battery-time">—</span></div>
      <div class="battery-grid"><div><span data-i18n="battery.left">Sol</span><strong id="battery-left">—</strong></div><div><span data-i18n="battery.right">Sağ</span><strong id="battery-right">—</strong></div><div><span data-i18n="battery.case">Kutu</span><strong id="battery-case">—</strong></div></div>
    </section>
    <section class="card controls" aria-label="Ses kontrolleri" data-i18n-aria="controls.ariaLabel">
      <div class="section-title"><h2>ANC</h2><span id="anc-value">—</span></div>
      <div class="segmented"><button data-anc="Off" data-i18n="anc.Off">Kapalı</button><button data-anc="Transparency" data-i18n="anc.Transparency">Şeffaflık</button><button data-anc="On" data-i18n="anc.On">Açık</button></div>
      <div class="toggle-row"><label for="game-mode">Game Mode</label><input id="game-mode" type="checkbox" role="switch"></div>
      <label for="eq" data-i18n="eq.label">EQ ön ayarı</label><select id="eq" disabled><option data-i18n="eq.empty">Doğrulanmış preset yok</option></select>
    </section>
    <section class="card log-card"><div class="section-title"><h2 data-i18n="log.title">Günlük</h2><button id="clear-log" class="link-button" data-i18n="log.clear">Temizle</button></div><pre id="log" aria-live="polite"></pre></section>
  </main>
</body>
</html>
