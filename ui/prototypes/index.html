<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Soundcore Liberty 5 için üç sade ve modern UI prototipi">
  <title>Liberty 5 — UI Prototypes</title>
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <main id="prototype-stage" class="prototype-stage"></main>

  <aside class="prototype-switcher" aria-label="Prototip değiştirici">
    <button id="previous-variant" class="switcher-arrow" type="button" aria-label="Önceki prototip">←</button>
    <div class="switcher-copy">
      <span class="switcher-kicker">STANDALONE PROTOTYPE</span>
      <strong id="variant-label">A — Focus</strong>
      <span id="variant-description">Tek bakışta durum ve tek ana aksiyon</span>
    </div>
    <button id="next-variant" class="switcher-arrow" type="button" aria-label="Sonraki prototip">→</button>
  </aside>
</body>
</html>
